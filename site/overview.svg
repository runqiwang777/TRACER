<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc"><title id="title">TRACER proof repair workflow</title><desc id="desc">A proposed proof is checked by Lean. TRACER preserves the error, provides feedback and optional examples, then verifies and saves the revised proof.</desc><rect width="1120" height="320" fill="#fafbf8"/><g font-family="Arial,sans-serif" fill="#112138"><text x="38" y="57" font-size="27" font-weight="700">TRACER</text><text x="38" y="92" font-size="17">AI proposes. Lean checks. TRACER organizes the repair.</text></g><g fill="none" stroke="#087f80" stroke-width="2"><path d="M248 186H290m-9-7 9 7-9 7M512 186H554m-9-7 9 7-9 7M776 186H818m-9-7 9 7-9 7"/></g><g font-family="Arial,sans-serif"><g fill="#e5efed"><rect x="38" y="135" width="210" height="101" rx="5"/><rect x="302" y="135" width="210" height="101" rx="5"/><rect x="566" y="135" width="210" height="101" rx="5"/><rect x="830" y="135" width="250" height="101" rx="5"/></g><g fill="#112138" font-size="21" font-weight="700"><text x="59" y="174">Check</text><text x="323" y="174">Explain</text><text x="587" y="174">Repair</text><text x="851" y="174">Verify and save</text></g><g fill="#425a6d" font-size="15"><text x="59" y="208">Candidate proof</text><text x="323" y="208">Source-linked errors</text><text x="587" y="208">Feedback and examples</text><text x="851" y="208">Independently recheck</text><text x="38" y="281">Saved examples need no API key. Live generation uses your chosen provider.</text></g></g></svg>